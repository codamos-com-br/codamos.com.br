<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1390" width="800" height="1390" role="img">
<title>Os cinco CVEs do nginx2root</title><desc>Cartões com os cinco CVEs, todos CVSS 9.2. CVE-2026-123007 e CVE-2026-123633 (HTTP/2) são bloqueados ao desligar o HTTP/2; CVE-2026-123634 (resolver/mirror), CVE-2026-121810 (HTTP/3) e CVE-2026-113425 (mail proxy) não.</desc>
<rect width="800" height="1390" rx="14" fill="#F7F7F8"/>
<text x="24" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#3F51B5" text-anchor="start">nginx2root</text>
<text x="24" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" fill="#84888E" text-anchor="start">5 CVEs, todos críticos: CVSS 4.0 = 9.2, sem autenticação</text>
<rect x="24" y="104" width="752" height="213" rx="10" fill="#FFFFFF" stroke="#E1E2E3"/>
<path d="M34 104h-0a10 10 0 0 0 -10 10v193a10 10 0 0 0 10 10z" fill="#3F51B5"/>
<rect x="24" y="114" width="6" height="193" fill="#3F51B5"/>
<text x="56" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3F51B5" text-anchor="start">CVE-2026-123007</text>
<text x="750" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#84888E" text-anchor="end">desde o nginx 1.9.5 (2015)</text>
<text x="56" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#2C2E35" text-anchor="start">HTTP/2: controle de fluxo</text>
<text x="56" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">Integer overflow que leva a leitura e escrita fora dos limites no heap</text>
<text x="56" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2C2E35"><tspan font-weight="700">Exposto se:</tspan> HTTP/2 ligado, em qualquer versão de 1.9.5 a 1.31.8</text>
<rect x="56" y="260" width="259" height="31" rx="15" fill="#E8EAF6"/>
<text x="72" y="280.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#3F51B5" text-anchor="start">✓</text>
<text x="92" y="280.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#3F51B5" text-anchor="start">Desligar HTTP/2 resolve</text>
<rect x="24" y="333" width="752" height="237" rx="10" fill="#FFFFFF" stroke="#E1E2E3"/>
<path d="M34 333h-0a10 10 0 0 0 -10 10v217a10 10 0 0 0 10 10z" fill="#3F51B5"/>
<rect x="24" y="343" width="6" height="217" fill="#3F51B5"/>
<text x="56" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3F51B5" text-anchor="start">CVE-2026-123633</text>
<text x="750" y="377" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#84888E" text-anchor="end">desde o nginx 1.19.7</text>
<text x="56" y="413" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#2C2E35" text-anchor="start">HTTP/2: drenagem de conexões</text>
<text x="56" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">Use-after-free quando o nginx faz proxy para um upstream</text>
<text x="56" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2C2E35"><tspan font-weight="700">Exposto se:</tspan> HTTP/2 + nginx como reverse proxy + worker com poucos slots</text>
<text x="56" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">de worker_connections</text>
<rect x="56" y="513" width="259" height="31" rx="15" fill="#E8EAF6"/>
<text x="72" y="533.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#3F51B5" text-anchor="start">✓</text>
<text x="92" y="533.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#3F51B5" text-anchor="start">Desligar HTTP/2 resolve</text>
<rect x="24" y="586" width="752" height="261" rx="10" fill="#FFFFFF" stroke="#E1E2E3"/>
<path d="M34 586h-0a10 10 0 0 0 -10 10v241a10 10 0 0 0 10 10z" fill="#CD0404"/>
<rect x="24" y="596" width="6" height="241" fill="#CD0404"/>
<text x="56" y="630" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3F51B5" text-anchor="start">CVE-2026-123634</text>
<text x="750" y="630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#84888E" text-anchor="end">desde o nginx 1.13.4</text>
<text x="56" y="666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#2C2E35" text-anchor="start">Resolver + mirror</text>
<text x="56" y="695" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">Use-after-free em subrequests com resolução de DNS em tempo de</text>
<text x="56" y="719" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">requisição</text>
<text x="56" y="749" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2C2E35"><tspan font-weight="700">Exposto se:</tspan> resolver + proxy_pass com destino vindo da requisição +</text>
<text x="56" y="773" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">mirror com mirror_request_body off (SSI também pode chegar lá)</text>
<rect x="56" y="790" width="295" height="31" rx="15" fill="#FCEBEB"/>
<text x="72" y="810.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#CD0404" text-anchor="start">✗</text>
<text x="92" y="810.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#CD0404" text-anchor="start">Desligar HTTP/2 NÃO resolve</text>
<rect x="24" y="863" width="752" height="213" rx="10" fill="#FFFFFF" stroke="#E1E2E3"/>
<path d="M34 863h-0a10 10 0 0 0 -10 10v193a10 10 0 0 0 10 10z" fill="#CD0404"/>
<rect x="24" y="873" width="6" height="193" fill="#CD0404"/>
<text x="56" y="907" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3F51B5" text-anchor="start">CVE-2026-121810</text>
<text x="750" y="907" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#84888E" text-anchor="end">desde o nginx 1.25.0</text>
<text x="56" y="943" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#2C2E35" text-anchor="start">HTTP/3 (QUIC)</text>
<text x="56" y="972" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">Use-after-free nos streams QUIC quando há proxy para upstream</text>
<text x="56" y="1002" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2C2E35"><tspan font-weight="700">Exposto se:</tspan> HTTP/3 ligado + proxy para upstream</text>
<rect x="56" y="1019" width="295" height="31" rx="15" fill="#FCEBEB"/>
<text x="72" y="1039.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#CD0404" text-anchor="start">✗</text>
<text x="92" y="1039.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#CD0404" text-anchor="start">Desligar HTTP/2 NÃO resolve</text>
<rect x="24" y="1092" width="752" height="237" rx="10" fill="#FFFFFF" stroke="#E1E2E3"/>
<path d="M34 1092h-0a10 10 0 0 0 -10 10v217a10 10 0 0 0 10 10z" fill="#CD0404"/>
<rect x="24" y="1102" width="6" height="217" fill="#CD0404"/>
<text x="56" y="1136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3F51B5" text-anchor="start">CVE-2026-113425</text>
<text x="750" y="1136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#84888E" text-anchor="end">desde o nginx 0.5.15</text>
<text x="56" y="1172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#2C2E35" text-anchor="start">Mail proxy</text>
<text x="56" y="1201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">Use-after-free no caminho do auth_http</text>
<text x="56" y="1231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2C2E35"><tspan font-weight="700">Exposto se:</tspan> bloco mail com proxy on e auth_http, mesmo com o auth</text>
<text x="56" y="1255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2C2E35" text-anchor="start">recusando todos os logins</text>
<rect x="56" y="1272" width="295" height="31" rx="15" fill="#FCEBEB"/>
<text x="72" y="1292.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#CD0404" text-anchor="start">✗</text>
<text x="92" y="1292.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#CD0404" text-anchor="start">Desligar HTTP/2 NÃO resolve</text>
<text x="24" y="1362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#3F51B5" text-anchor="start">Atualizar para 1.30.7 ou 1.31.9 (e reiniciar) corrige os cinco.</text>
</svg>
