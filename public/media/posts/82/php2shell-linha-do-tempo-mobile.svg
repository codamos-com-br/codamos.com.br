<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 790" width="400" height="790" role="img">
<title>Linha do tempo do PHP2Shell</title><desc>17/10: Honeypot da Amazon registra a primeira tentativa de exploração; 20/10 ~15:00 UTC: Os IDs dos CVEs vazam com CVSS 10.0 e data errada; 20/10 19:30 UTC: PHP antecipa a release de 22/10 para 21/10, 14:00 UTC; 20/10 ~20:00 UTC: Calif publica por engano um vídeo da prova de conceito; 21/10 07:34 UTC: Patchstack relata incidentes de exploração em hospedagens; 21/10 07:41 UTC: Chainguard quebra o embargo publicando imagens já corrigidas; 21/10 13:34 UTC: Advisories e releases saem: 8.5.12, 8.4.27, 8.3.36, 8.2.35; 25/10 15:47 UTC: Servidor sem patch invadido no desafio “Steal My Bitcoin”; 26/10: CISA coloca os dois CVEs no catálogo KEV; 29/10: Unit 42: PAN-OS explorado, encadeado com bug do kernel até root</desc>
<rect width="400" height="790" rx="14" fill="#F7F7F8"/>
<text x="18" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#2C2E35" text-anchor="start">Do vazamento ao patch (e depois)</text>
